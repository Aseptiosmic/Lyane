name: Upload Release Asset

on:
  push:
    branches:
      - arena/01a106ab-lyane
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to"
        required: true
        default: "v1.0.0"
      asset_path:
        description: "Path to the APK file in the repo"
        required: true
        default: "Lyane.apk"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v1.0.0' }}
          ASSET_PATH: ${{ github.event.inputs.asset_path || 'Lyane.apk' }}
        run: |
          gh release upload "$TAG" "$ASSET_PATH" --clobber
