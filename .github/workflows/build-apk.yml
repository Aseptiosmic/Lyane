name: Build and Release Real APK

on:
  push:
    branches:
      - arena/01a106ab-lyane
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the built APK to (created if missing)"
        required: true
        default: "v1.0.0"
      build_type:
        description: "assembleDebug or assembleRelease"
        required: true
        default: "assembleRelease"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate release keystore (self-signed, matches build.gradle.kts config)
        run: |
          keytool -genkeypair -v \
            -keystore lyane-release.keystore \
            -alias lyane_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lyane_keystore_pass \
            -keypass lyane_keystore_pass \
            -dname "CN=Lyane, OU=Lyane, O=Lyane, L=Istanbul, S=Istanbul, C=TR"

      - name: Build APK
        id: build
        continue-on-error: true
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'assembleRelease' }}
        run: |
          set -o pipefail
          gradle "$BUILD_TYPE" --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Post build log on failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Kotlin/compiler errors (grep)"
            echo '```'
            grep -E "^e: |error:|: error " build.log | head -c 40000
            echo '```'
            echo "## Tail of log"
            echo '```'
            tail -c 20000 build.log
            echo '```'
          } > issue_body.md
          gh issue create --title "Build failed: run ${{ github.run_id }}" --body-file issue_body.md

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Debug outputs tree
        if: always()
        run: find app/build -maxdepth 6 -type d 2>&1 | sort; echo "---apk search---"; find app/build -iname "*.apk" 2>&1

      - name: Locate APK
        id: find_apk
        run: |
          set -e
          APK_PATH=$(find app/build/outputs -iname "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!" >&2
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" Lyane.apk
          echo "apk_path=Lyane.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyane-apk
          path: Lyane.apk

      - name: Upload/replace APK on release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || 'v1.0.0' }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Lyane.apk" --clobber
          else
            gh release create "$TAG" "Lyane.apk" --title "Lyane $TAG" --notes "Automated real Gradle build."
          fi
